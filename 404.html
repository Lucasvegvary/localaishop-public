<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · The Local AI Shop</title>
<meta name="robots" content="noindex">
<style>
  :root{--accent:#F06000;--accent-dark:#c94f00;--accent-deep:#a84200;--ink:#111418;--paper:#faf9f6;--line:#e6e2da;--muted:#5d6570}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.7;font-size:17px}
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px 96px}
  h1{font-family:Georgia,'Times New Roman',serif;line-height:1.2;font-size:32px;margin-bottom:12px}
  p{color:#2e343b;margin-bottom:26px;max-width:560px}
  .home{display:inline-block;margin-bottom:28px;font-size:14px;text-decoration:none;color:var(--muted)}
  .btn{display:inline-block;background:var(--accent-dark);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:16px 28px;border-radius:10px}
  .btn:hover{background:var(--accent-deep)}
</style>
</head>
<body>
<main class="wrap">
  <a class="home" href="/">← The Local AI Shop</a>
  <h1>Nothing at this address.</h1>
  <p>The link may be old or mistyped. Everything I offer is on the home page.</p>
  <a class="btn" id="book" data-book href="https://api.leadconnectorhq.com/widget/bookings/las-mini-audit">Book my free 15-minute call</a>
</main>
<script>
/* Launch guard: until ./fill.sh fills the booking token, the booking link opens an email instead. Inert once filled. */
(function(){
  var B='__BOOKING'+'_URL__';
  document.querySelectorAll('a[href="'+B+'"]').forEach(function(a){a.setAttribute('href','mailto:lucas@localaishop.com?subject=Booking%20request');});
})();
</script>
<script src="/carry.js"></script>
<script>
/* /book/ and /Book land here: send them to the booking calendar, letter tag included. */
(function(){
  if(!/^\/book\/?$/i.test(window.location.pathname)){return;}
  var a=document.getElementById('book');
  var h=a.getAttribute('href');
  if(window.lasCarry){h=window.lasCarry(h);}
  if(/^https?:\/\//i.test(h)){window.location.replace(h);}
})();
</script>
</body>
</html>
